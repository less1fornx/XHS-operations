[project]
name = "phase0-langgraph"
version = "0.1.0"
description = "A no-LLM LangGraph learning lab for the agent operations app"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phase0_graph"]
