[project]
name = "agent-operations-workbench"
version = "0.1.0"
description = "Local agent operations workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.142.2",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlmodel>=0.0.47",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.uv]
package = false
